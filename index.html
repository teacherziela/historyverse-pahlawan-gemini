<!DOCTYPE html><html lang="ms"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>HistoryVerse 360 — Pahlawan Alam Melayu</title><script src="https://cdn.tailwindcss.com"></script><style>body{margin:0;background:#10251d;color:white;font-family:system-ui}canvas{display:block;width:100vw;height:100vh}button,input,textarea{font:inherit}button{cursor:pointer}.panel{background:#2b2119;border:3px solid #d4a34b;border-radius:20px;padding:18px;max-width:650px;width:min(94vw,650px);max-height:90vh;overflow:auto;box-sizing:border-box}.overlay{position:fixed;inset:0;background:#000b;display:flex;align-items:center;justify-content:center;z-index:20}.hide{display:none!important}.btn{background:#157f58;border:2px solid #ffd86f;border-radius:12px;color:#fff;padding:10px 15px;margin:5px}.field{padding:10px;border-radius:10px;color:#111;width:100%;margin:5px 0}.hud{position:fixed;top:0;left:0;right:0;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap;padding:8px;background:#0f172acc;font-size:13px;z-index:3}.controls{position:fixed;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;padding:0 12px;z-index:4}.controls button{background:#14532dcc;border:2px solid #fbbf24;border-radius:15px;color:white;min-width:58px;min-height:60px;font-weight:bold;touch-action:none}.question{display:block;text-align:left;width:100%;background:#ffefc6;color:#27190a;border:2px solid #c38a32;border-radius:12px;padding:12px;margin:8px 0}.question:disabled{opacity:.65}#toast{position:fixed;bottom:95px;left:50%;transform:translateX(-50%);background:#1f2937;padding:10px;border-radius:12px;z-index:25;pointer-events:none}</style></head><body><canvas id="game"></canvas><div id="hud" class="hud hide"><span id="status"></span><span id="progress"></span><button class="btn" onclick="showMenu()">🏠 Menu</button></div><div id="controls" class="controls hide"><div><button id="left">◀</button><button id="right">▶</button></div><div><button onclick="interact()">💬 Buka</button><button onclick="attack()">⚔️</button><button id="jump">⏫</button></div></div><div id="menu" class="overlay"><div class="panel"><h1 style="color:#fbbf24;text-align:center">⚔️ HISTORYVERSE 360</h1><h2 style="text-align:center">Pahlawan Alam Melayu</h2><p>Sejarah Tingkatan 2 • Bab 1 (1.1–1.4)</p><label>Nama penuh murid</label><input class="field" id="name" placeholder="Nama murid"><label>Kelas</label><input class="field" id="class" placeholder="Contoh: 2 Adil"><p>Pilih pengembaraan:</p><select class="field" id="level"><option value="0">1.1 Konsep Alam Melayu</option><option value="1">1.2 Kewujudan Kerajaan</option><option value="2">1.3 Kerajaan Masyhur</option><option value="3">1.4 Kerajaan Sezaman</option></select><button class="btn" onclick="start()">▶️ START GAME SEKARANG</button><p style="font-size:13px">Komputer: A/D atau ←/→ bergerak, Space lompat, J pedang, E berinteraksi. Telefon: guna butang di skrin.</p><p style="font-size:12px;color:#fcd34d">Rekod disimpan pada peranti ini. PBD rasmi memerlukan semakan guru.</p></div></div><div id="modal" class="overlay hide"><div class="panel"><h2 id="mt"></h2><div id="mb"></div><button class="btn" onclick="closeModal()">Tutup</button></div></div><div id="toast" class="hide"></div><script>
const chapters=[
{title:"Konsep Alam Melayu",qs:[
["Aspek utama konsep Alam Melayu ialah",["Geografi, bahasa dan budaya","Sukan, politik dan cuaca","Industri, teknologi dan astronomi"],0],
["Siapakah tokoh yang mengkaji Kepulauan Melayu dari sudut geografi?",["Alfred Russel Wallace","Julius Caesar","Marco Polo"],0],
["Sebutan 'empat' dalam bahasa Tagalog ialah",["Apat","Quatre","Fatra"],0],
["Apakah kesan bahasa serumpun?",["Memudahkan komunikasi serantau","Menghalang kerjasama","Menghapuskan warisan"],0],
["Antara warisan budaya Alam Melayu ialah",["Wayang kulit","Koloseum","Hieroglif"],0]],
ks:[["Mengapakah persamaan bahasa dan budaya dapat memupuk perpaduan serantau?","perpaduan, komunikasi, kerjasama, hormat"],["Mengapakah gotong-royong wajar dikekalkan?","kerjasama, warisan, keharmonian, jati diri"]]},
{title:"Kewujudan Kerajaan",qs:[
["Kerajaan Alam Melayu yang wujud pada abad pertama Masihi ialah",["Funan","Majapahit","Melaka"],0],
["Kedah Tua terletak di",["Sungai Mas dan Sungai Bujang","Sungai Musi","Sungai Brantas"],0],
["Srivijaya berpusat di",["Lembah Sungai Musi","Lembah Sungai Mekong","Lembah Sungai Nil"],0],
["Majapahit terletak di",["Lembah Sungai Brantas","Sungai Amazon","Sungai Thames"],0],
["Gangga Nagara terletak di",["Pantai barat bahagian tengah Tanah Melayu","Jawa Timur","Selatan Vietnam"],0]],
ks:[["Mengapakah lembah sungai menjadi tumpuan kerajaan awal?","air, pertanian, tanah subur, pengangkutan"],["Bagaimanakah kita dapat menjaga sungai hari ini?","kebersihan, pencemaran, sumber air, pemuliharaan"]]},
{title:"Kerajaan Masyhur",qs:[
["Pemerintah yang memasyhurkan kerajaan Funan ialah",["Fan Shih-man","Hayam Wuruk","Suryavarman II"],0],
["Pemerintah Champa yang terkenal ialah",["Che Bong Nga","Gajah Mada","Kaundinya"],0],
["Kerajaan yang menguasai Selat Melaka dan Selat Sunda ialah",["Srivijaya","Angkor","Funan"],0],
["Suryavarman II terkenal kerana",["Membina Angkor Wat","Membina Borobudur","Membina Kota A Famosa"],0],
["Kedah Tua masyhur sebagai",["Pusat perdagangan dan keagamaan","Pusat industri kapal terbang","Pusat perlombongan minyak moden"],0]],
ks:[["Apakah ciri pemimpin unggul yang dapat diteladani?","bijaksana, adil, kebajikan, berwawasan"],["Bagaimana Malaysia boleh meningkatkan daya saing pelabuhan?","teknologi, keselamatan, perdagangan, infrastruktur"]]},
{title:"Kerajaan Sezaman",qs:[
["Pada abad pertama, Funan sezaman dengan",["Empayar Rom dan Dinasti Han","Empayar British","Dinasti Ming"],0],
["Pada abad kesembilan, Srivijaya sezaman dengan",["Kerajaan Abbasiyah dan Dinasti Tang","Empayar British","Empayar Mongol"],0],
["Antara bentuk hubungan luar kerajaan Alam Melayu ialah",["Perdagangan, keagamaan dan diplomatik","Sukan sahaja","Pengasingan"],0],
["Tujuan hubungan diplomatik dengan kerajaan luar ialah",["Mengukuhkan persahabatan dan kerjasama","Menutup semua pelabuhan","Menghapuskan perdagangan"],0],
["Pada abad ke-14, Majapahit sezaman dengan",["Empayar Mongol dan Kesultanan Delhi","Empayar Rom","Dinasti Han"],0]],
ks:[["Mengapakah hubungan diplomatik penting kepada Malaysia?","keamanan, ekonomi, perdagangan, kedaulatan"],["Apakah iktibar daripada kegemilangan kerajaan Alam Melayu?","jati diri, ilmu, usaha, warisan, bangga"]]}
];
const canvas=document.getElementById('game'),c=canvas.getContext('2d');let state=null,held={left:false,right:false,jump:false},objects=[],near=null,cam=0,locked=false;
function resize(){canvas.width=innerWidth;canvas.height=innerHeight}onresize=resize;resize();
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.remove('hide');setTimeout(()=>e.classList.add('hide'),2300)}
function save(){if(!state)return;localStorage.setItem('HV_PAHL_GAME_'+state.name+'_'+state.cls,JSON.stringify(state))}
function start(){let name=document.getElementById('name').value.trim(),cls=document.getElementById('class').value.trim();if(!name||!cls){toast('Isi nama dan kelas dahulu');return}let level=+document.getElementById('level').value;state={name,cls,level,score:0,coins:0,lives:3,answered:{},kbat:{},done:[],x:80,y:400,vy:0,face:1,attack:0,immune:0,checkpoint:80};load();document.getElementById('menu').classList.add('hide');document.getElementById('hud').classList.remove('hide');document.getElementById('controls').classList.remove('hide');save()}
function load(){objects=[];for(let i=0;i<5;i++)objects.push({type:'q',i,x:530+i*475,y:450});for(let i=0;i<2;i++)objects.push({type:'k',i,x:900+i*1220,y:425});objects.push({type:'npc',x:270,y:445});objects.push({type:'gate',x:3180,y:400});for(let i=0;i<5;i++)objects.push({type:'enemy',x:650+i*510,y:446,hp:i>2?3:2,dir:i%2?1:-1,orig:650+i*510});state.x=80;state.y=360;state.vy=0;state.checkpoint=80;cam=0;hud()}
function hud(){let q=chapters[state.level].qs.filter((_,i)=>state.answered[state.level+'-'+i]).length,k=chapters[state.level].ks.filter((_,i)=>state.kbat[state.level+'-'+i]).length;document.getElementById('status').textContent='⚔️ '+state.name+' • ❤️ '+state.lives+' • ⭐ '+state.score+' • 🪙 '+state.coins;document.getElementById('progress').textContent='Level '+(state.level+1)+' • 📜 '+q+'/5 • 🧠 '+k+'/2'}
function showMenu(){locked=true;document.getElementById('menu').classList.remove('hide');document.getElementById('hud').classList.add('hide');document.getElementById('controls').classList.add('hide');save()}
function openModal(title,html){locked=true;document.getElementById('mt').textContent=title;document.getElementById('mb').innerHTML=html;document.getElementById('modal').classList.remove('hide')}
function closeModal(){document.getElementById('modal').classList.add('hide');locked=false}
function interact(){if(!state||locked||!near)return;let o=near,id=state.level+'-'+o.i;if(o.type==='npc'){openModal('Tok Penghulu','Selamat datang, pahlawan! Jawab lima Peti Ilmu dan dua cabaran KBAT untuk membuka gerbang.')}else if(o.type==='q'){let q=chapters[state.level].qs[o.i],buttons=q[1].map((a,i)=>'<button class="question" onclick="answer('+o.i+','+i+')">'+String.fromCharCode(65+i)+'. '+a+'</button>').join('');openModal('📜 Peti Ilmu '+(o.i+1),'<p>'+q[0]+'</p>'+buttons+'<div id="feedback"></div>')}else if(o.type==='k'){let k=chapters[state.level].ks[o.i];openModal('🧠 Cabaran KBAT '+(o.i+1),'<p>'+k[0]+'</p><textarea class="field" id="reflection" rows="4" placeholder="Tulis hujah dan contoh..."></textarea><button class="btn" onclick="answerK('+o.i+')">Hantar jawapan</button><p id="feedback"></p>')}else if(o.type==='gate'){if(completed()){if(!state.done.includes(state.level))state.done.push(state.level);save();if(state.level===3){openModal('🏆 Tahniah!','Pengembaraan tamat. Rekod jawapan disimpan pada peranti ini.');return}state.level++;load();toast('Level baharu dibuka!')}else toast('Lengkapkan 5 objektif dan 2 KBAT dahulu')}} 
function answer(i,a){let q=chapters[state.level].qs[i],id=state.level+'-'+i;if(a===q[2]){if(!state.answered[id]){state.answered[id]=true;state.score+=100;state.coins+=10}document.getElementById('feedback').innerHTML='<p>✅ Betul! +100 markah</p><button class="btn" onclick="closeModal()">Teruskan</button>';save();hud()}else document.getElementById('feedback').textContent='❌ Cuba lagi. Rujuk fakta Sejarah Tingkatan 2.'}
function answerK(i){let v=document.getElementById('reflection').value.trim(),id=state.level+'-'+i;if(v.length<20){document.getElementById('feedback').textContent='Sila beri huraian sekurang-kurangnya 20 aksara.';return}if(!state.kbat[id]){state.score+=150;state.coins+=15}state.kbat[id]=v;save();hud();document.getElementById('feedback').textContent='✅ Jawapan disimpan untuk semakan guru (bukan TP automatik).';setTimeout(closeModal,950)}
function completed(){return chapters[state.level].qs.every((_,i)=>state.answered[state.level+'-'+i])&&chapters[state.level].ks.every((_,i)=>state.kbat[state.level+'-'+i])}
function attack(){if(state&&!locked)state.attack=16}
function tick(){requestAnimationFrame(tick);let W=canvas.width,H=canvas.height,offset=H-620;c.fillStyle='#87cbd1';c.fillRect(0,0,W,H);let draw=(x,y,w,h,col)=>{c.fillStyle=col;c.fillRect(x-cam,y+offset,w,h)};c.fillStyle='#29754c';for(let i=0;i<9;i++){let x=i*470-(cam*.2%470);c.beginPath();c.moveTo(x,H);c.lineTo(x+180,H-300);c.lineTo(x+410,H);c.fill()}if(!state)return;let p=state;if(!locked){p.x+=held.left?-5:held.right?5:0;p.face=held.left?-1:held.right?1:p.face;if(held.jump&&p.y>=436){p.vy=-13}p.vy=Math.min(p.vy+.62,14);p.y+=p.vy;if(p.y>=436&&((p.x<920)||(p.x>1020&&p.x<1980)||(p.x>2080))){p.y=436;p.vy=0}if(p.y>660){p.lives--;p.x=p.checkpoint;p.y=360;p.vy=0;toast('Terjatuh ke sungai!')}if(p.x>1180)p.checkpoint=1100;if(p.x>2350)p.checkpoint=2220;if(p.x<20)p.x=20;if(p.x>3330)p.x=3330;if(p.lives<=0){p.lives=3;p.x=80;toast('Nyawa diperbaharui!')}if(p.attack>0)p.attack--;if(p.immune>0)p.immune--;objects.filter(o=>o.type==='enemy'&&o.hp>0).forEach(o=>{o.x+=o.dir*1.4;if(Math.abs(o.x-o.orig)>90)o.dir*=-1;if(Math.abs(o.x-p.x)<50&&Math.abs(o.y-p.y)<65){if(p.attack>0&&((o.x>p.x)===(p.face>0))){o.hp--;p.attack=0;if(o.hp<=0){p.score+=50;p.coins+=5;toast('⚔️ Perompak ditewaskan!')}}else if(p.immune===0){p.lives--;p.immune=75;toast('💔 Terkena serangan!')}}});cam+=((p.x-W*.35)-cam)*.12;cam=Math.max(0,Math.min(3450-W,cam));hud()}draw(0,500,920,200,'#80502f');draw(1020,500,960,200,'#80502f');draw(2080,500,1370,200,'#80502f');draw(920,520,100,100,'#087fbd');draw(1980,520,100,100,'#087fbd');[0,1020,2080].forEach((x,i)=>draw(x,500,[920,960,1370][i],19,'#3b9b4b'));for(let x=150;x<3400;x+=460){draw(x,380,120,80,'#9a6537');c.fillStyle='#7b3f19';c.beginPath();c.moveTo(x-15-cam,380+offset);c.lineTo(x+60-cam,322+offset);c.lineTo(x+135-cam,380+offset);c.fill();draw(x+20,420,24,25,'#fae7a2')}objects.forEach(o=>{if(o.type==='q'){draw(o.x,o.y,46,40,state.answered[state.level+'-'+o.i]?'#059669':'#ca8a04');draw(o.x+17,o.y+13,12,12,'#fde68a')}if(o.type==='k'){draw(o.x,o.y,54,75,state.kbat[state.level+'-'+o.i]?'#059669':'#7c3aed');c.fillStyle='white';c.font='bold 12px sans-serif';c.fillText('KBAT',o.x+4-cam,o.y+40+offset)}if(o.type==='npc'){draw(o.x,o.y,38,55,'#1d4ed8');draw(o.x+7,o.y-17,25,25,'#f3cfaa')}if(o.type==='gate'){draw(o.x,o.y,85,100,completed()?'#059669':'#7f1d1d');draw(o.x+20,o.y+15,45,85,'#172554')}if(o.type==='enemy'&&o.hp>0){draw(o.x,o.y,40,54,'#991b1b');draw(o.x+7,o.y-14,26,24,'#d9ad7d');draw(o.x+26,o.y+20,32,5,'#ddd6fe')}});draw(p.x,p.y,42,64,p.immune>0?'#f59e0b':'#047857');draw(p.x+8,p.y-20,26,26,'#efc29b');draw(p.x+3,p.y-29,36,10,'#1e293b');draw(p.x+12,p.y+33,22,8,'#fbbf24');draw(p.x+(p.face===1?35:-31),p.y+18,34,5,p.attack>0?'#fde047':'#e2e8f0');if(!locked){near=objects.filter(o=>o.type!=='enemy').find(o=>Math.abs(o.x-p.x)<75&&Math.abs(o.y-p.y)<95)||null;}}
function bind(id,key){let e=document.getElementById(id);for(let event of ['pointerdown','pointerup','pointercancel','pointerleave'])e.addEventListener(event,x=>{x.preventDefault();held[key]=event==='pointerdown'})}bind('left','left');bind('right','right');bind('jump','jump');addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','SELECT'].includes(document.activeElement.tagName))return;if(['ArrowLeft','KeyA'].includes(e.code))held.left=true;if(['ArrowRight','KeyD'].includes(e.code))held.right=true;if(['Space','ArrowUp','KeyW'].includes(e.code)){held.jump=true;e.preventDefault()}if(e.code==='KeyJ')attack();if(e.code==='KeyE')interact()});addEventListener('keyup',e=>{if(['ArrowLeft','KeyA'].includes(e.code))held.left=false;if(['ArrowRight','KeyD'].includes(e.code))held.right=false;if(['Space','ArrowUp','KeyW'].includes(e.code))held.jump=false});tick();
</script></body></html>
